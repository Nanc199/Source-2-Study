 <rect x="660" y="775" width="270" height="125" rx="18" fill="#FFFFFF" stroke="#D5C9F5" stroke-width="2"/>
 <text x="795" y="817" text-anchor="middle" class="boxTitle">Duplicate Detection</text><text x="795" y="850" text-anchor="middle" class="small">Groups likely repeated</text><text x="795" y="877" text-anchor="middle" class="tiny">questions for review</text>
