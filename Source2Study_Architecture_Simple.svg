<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Source2Study system architecture</title>
<desc id="desc">Student uses the Next.js frontend and REST API to access a FastAPI backend. The backend integrates Gemini, Sentence Transformers, SQLite, ChromaDB, and file storage.</desc>
<defs>
 <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L15 8L1 15Z" fill="#5427C8"/></marker>
 <marker id="arrowData" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L15 8L1 15Z" fill="#1D4ED8"/></marker>
 <marker id="arrowAI" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L15 8L1 15Z" fill="#E57B16"/></marker>
 <linearGradient id="head" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6538D3"/><stop offset="1" stop-color="#3D1AA6"/></linearGradient>
 <style>
 .title{font:700 66px Arial,sans-serif;fill:#17134B}.node{font:700 42px Arial,sans-serif;fill:#1B2450}.hint{font:500 30px Arial,sans-serif;fill:#344054}.group{font:700 48px Arial,sans-serif;fill:#1B2450}.service{font:600 48px Arial,sans-serif;fill:#26324A}.flow{fill:none;stroke:#5427C8;stroke-width:12;marker-end:url(#arrow);stroke-linecap:round}.data{fill:none;stroke:#1D4ED8;stroke-width:9;marker-end:url(#arrowData);stroke-linecap:round;stroke-linejoin:round}.ai{fill:none;stroke:#E57B16;stroke-width:9;marker-end:url(#arrowAI);stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1600" height="1000" fill="#fff"/>
<circle cx="86" cy="83" r="55" fill="#F1EDFF"/><circle cx="1513" cy="80" r="60" fill="#F4F0FF"/>
<text x="800" y="95" text-anchor="middle" class="title">Source2Study Architecture</text>
<!-- primary request flow -->
<rect x="55" y="205" width="300" height="190" rx="28" fill="#EEF4FF" stroke="#7196EA" stroke-width="5"/>
<text x="205" y="290" text-anchor="middle" class="node">Student / User</text><text x="205" y="345" text-anchor="middle" class="hint">Upload · study</text>
<rect x="425" y="205" width="320" height="190" rx="28" fill="#EEF4FF" stroke="#4285EB" stroke-width="5"/>
<text x="585" y="280" text-anchor="middle" class="node">Frontend</text><text x="585" y="337" text-anchor="middle" class="hint">Next.js</text>
<rect x="815" y="205" width="260" height="190" rx="28" fill="#F4EEFF" stroke="#8061D5" stroke-width="5"/>
<text x="945" y="290" text-anchor="middle" class="node">REST API</text><text x="945" y="345" text-anchor="middle" class="hint">HTTP / JSON</text>
<rect x="1145" y="205" width="400" height="190" rx="28" fill="#EEE8FF" stroke="#7650CD" stroke-width="5"/>
<rect x="1145" y="205" width="400" height="72" rx="25" fill="url(#head)"/>
<text x="1345" y="260" text-anchor="middle" style="font:700 46px Arial,sans-serif;fill:#fff">FastAPI Backend</text>
<text x="1345" y="328" text-anchor="middle" class="hint">RAG · processing</text><text x="1345" y="370" text-anchor="middle" class="hint">Generation · duplicates</text>
<path d="M355 300H412" class="flow"/><path d="M745 300H802" class="flow"/><path d="M1075 300H1132" class="flow"/>
<!-- integrations from backend -->
<path d="M1345 395V475H435V560" class="ai"/>
<path d="M1345 475H1165V560" class="data"/>
<!-- AI services -->
<rect x="95" y="570" width="680" height="240" rx="28" fill="#FFF5E8" stroke="#E89A3C" stroke-width="5"/>
<text x="435" y="635" text-anchor="middle" class="group">AI SERVICES</text>
<text x="435" y="705" text-anchor="middle" class="service">Gemini API</text>
<text x="435" y="770" text-anchor="middle" class="service">Sentence Transformers</text>
<!-- data services -->
<rect x="825" y="570" width="680" height="240" rx="28" fill="#EFF9F1" stroke="#59A96A" stroke-width="5"/>
<text x="1165" y="635" text-anchor="middle" class="group">DATA AND FILE STORAGE</text>
<text x="1165" y="705" text-anchor="middle" class="service">SQLite · ChromaDB</text>
<text x="1165" y="770" text-anchor="middle" class="service">Uploaded source files</text>
</svg>

